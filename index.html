<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Compass</title>
<meta name="description" content="Rate 48 statements and see where you stand on the eight questions that divide the AI world, then compare with friends.">
<meta property="og:title" content="AI Compass">
<meta property="og:description" content="Where do you stand on AI? Eight axes, 48 statements, eleven camps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23fff' stroke='%23B3206F' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23B3206F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&amp;display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a navigation chart. One left-aligned column; the chart is the only loud
     object, drawn in magenta overprint on quiet chart paper. The middle ground is an island. */
  --paper: #F2F5F4;
  --surface: #FBFCFC;
  --sea: #DCE9EE;
  --island: #EFE3B9;
  --ink: #12243A;
  --ink-2: #44566A;
  --muted: #627080;
  --rule: #C4CFD4;
  --accent: #B3206F;
  --on-accent: #FFFFFF;
  --accent-wash: #F4DCE9;
  --friend: #2A78D6;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Newsreader", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0B1620; --surface: #122230; --sea: #15303F; --island: #453F22;
    --ink: #E5EDF0; --ink-2: #AEBCC6; --muted: #8C9AA5; --rule: #2C4050;
    --accent: #E0559F; --on-accent: #1A0A13; --accent-wash: #44203A; --friend: #4C8DE8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0B1620; --surface: #122230; --sea: #15303F; --island: #453F22;
  --ink: #E5EDF0; --ink-2: #AEBCC6; --muted: #8C9AA5; --rule: #2C4050;
  --accent: #E0559F; --on-accent: #1A0A13; --accent-wash: #44203A; --friend: #4C8DE8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 18px/1.55 var(--body); font-optical-sizing: auto;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 44px); }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.statement:focus, .camp-name:focus { outline: none; }
.ui { font-family: var(--display); font-stretch: 88%; }

/* ---------- top bar ---------- */
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px;
  padding: 14px 0; border-bottom: 1.5px solid var(--ink); }
.brand { display: inline-flex; align-items: center; gap: 9px; padding: 4px 2px; border: 0; background: none;
  color: var(--ink); cursor: pointer; font: 800 21px/1 var(--display); font-stretch: 76%; letter-spacing: .01em; }
.brand { white-space: nowrap; }
.brand svg { display: block; }
.top-right { display: flex; align-items: center; gap: 14px; font: 500 15px/1.2 var(--display); font-stretch: 88%; color: var(--ink-2); }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 20px;
  border: 1.5px solid var(--ink); border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer;
  font: 700 17px/1.15 var(--display); font-stretch: 88%; text-align: center; }
.btn:hover { background: var(--accent-wash); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { min-height: 36px; padding: 6px 2px; border-color: transparent; background: none; font-weight: 600; font-size: 15px;
  text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--muted); }
.btn.quiet:hover { text-decoration-color: var(--accent); }
.btn.small { min-height: 34px; padding: 5px 12px; font-size: 14px; font-weight: 600; }
.btn[disabled] { opacity: .4; cursor: default; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }

/* ---------- intro ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 32px 56px; align-items: center; padding: 48px 0 16px; }
.hero h1, .camp-name { margin: 0; font: 800 clamp(46px, 7.4vw, 92px)/.9 var(--display); font-stretch: 66%;
  letter-spacing: -.012em; text-wrap: balance; }
.lede { margin-top: 22px; max-width: 30em; font-size: 20px; line-height: 1.45; color: var(--ink-2); }
.hero .row { margin-top: 28px; }
.fine { margin-top: 14px; font: 500 15px/1.4 var(--display); font-stretch: 88%; color: var(--muted); max-width: 34em; }
.source-credit { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--rule);
  max-width: 35em; font: 500 14.5px/1.5 var(--display); font-stretch: 88%; color: var(--muted); }
.source-credit a { color: var(--ink-2); text-decoration-color: var(--muted); }
.source-credit a:hover { color: var(--accent); text-decoration-color: var(--accent); }
.notice { margin-top: 24px; padding: 14px 16px; border-left: 4px solid var(--friend); background: var(--surface);
  font: 500 16px/1.4 var(--display); font-stretch: 88%; }
.chart figure, figure.chart { margin: 0; }
.compass { width: 100%; }
.compass svg { display: block; max-width: 100%; height: auto; }
figcaption { margin-top: 10px; font: 500 14.5px/1.4 var(--display); font-stretch: 88%; color: var(--muted); max-width: 46em; }

h2 { margin: 0 0 20px; padding-top: 14px; border-top: 1.5px solid var(--ink);
  font: 700 28px/1.1 var(--display); font-stretch: 76%; text-wrap: balance; }
section { margin-top: 56px; }
.axes-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 56px; margin: 0; padding: 0; list-style: none; }
.axes-list h3 { margin: 0 0 4px; font: 700 19px/1.2 var(--display); font-stretch: 80%; }
.axes-list p { color: var(--ink-2); line-height: 1.4; }
.versus { display: flex; align-items: center; gap: 10px; margin-top: 8px; font: 600 14.5px/1.2 var(--display); font-stretch: 88%; }
.versus i { flex: 1; min-width: 20px; max-width: 90px; height: 1.5px; background: var(--ink-2); }

/* ---------- quiz ---------- */
.quiz { max-width: 860px; padding: 28px 0 56px; }
.ticks { display: flex; align-items: flex-end; gap: 2px; height: 16px; }
.ticks i { flex: 1; height: 6px; background: var(--rule); }
.ticks i.gate { height: 11px; }
.ticks i.done { background: var(--ink-2); }
.ticks i.skip { background: var(--muted); height: 3px; }
.ticks i.now { background: var(--accent); height: 16px; }
.count { margin-top: 10px; display: flex; justify-content: space-between; gap: 16px;
  font: 500 15px/1.3 var(--display); font-stretch: 88%; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.statement { margin: 34px 0 30px; max-width: 21em; min-height: 3.6em; font: 500 clamp(25px, 3.7vw, 37px)/1.17 var(--body);
  letter-spacing: -.006em; text-wrap: balance; }
.likert { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.likert button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
  min-height: 72px; padding: 10px 6px; border: 1.5px solid var(--ink); border-radius: 3px; background: var(--surface);
  color: var(--ink); cursor: pointer; font: 600 16px/1.12 var(--display); font-stretch: 84%; text-align: center; }
.likert button:hover { background: var(--accent-wash); }
.likert button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.likert kbd { font: 500 12px/1 var(--display); color: var(--muted); }
.likert button[aria-pressed="true"] kbd { color: inherit; opacity: .8; }
.under { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 24px; margin-top: 12px; }
details.note { max-width: 34em; }
summary { cursor: pointer; font: 600 15px/1.3 var(--display); font-stretch: 88%; padding: 8px 0; color: var(--ink-2); }
summary:hover { color: var(--ink); }
details.note p { padding: 2px 0 8px; font-size: 17px; line-height: 1.45; color: var(--ink-2); }
.quiz-nav { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px;
  margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rule); }
.keys { margin-top: 18px; font: 500 14px/1.4 var(--display); font-stretch: 88%; color: var(--muted); }
@media (hover: none), (pointer: coarse) { .likert kbd, .keys { display: none; } }

/* ---------- result ---------- */
.result-head { padding: 44px 0 0; }
.kicker { font: 600 17px/1.2 var(--display); font-stretch: 88%; color: var(--ink-2); margin-bottom: 10px; }
.camp-name { font-size: clamp(42px, 6.6vw, 80px); }
.match { margin-top: 16px; font: 700 20px/1.2 var(--display); font-stretch: 84%; }
.match span { font-weight: 500; color: var(--ink-2); }
.creed { margin-top: 18px; font: italic 500 26px/1.25 var(--body); max-width: 24em; text-wrap: balance; }
.about { margin-top: 14px; max-width: 62ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 20px 0 0; max-width: 70ch; }
.facts dt { font: 600 15px/1.6 var(--display); font-stretch: 88%; color: var(--ink-2); }
.facts dd { margin: 0; font-size: 17px; line-height: 1.45; }
.partial { margin-top: 24px; padding: 14px 16px; border-left: 4px solid var(--accent); background: var(--surface);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; font: 500 16px/1.4 var(--display); font-stretch: 88%; }

.position { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 4fr); gap: 28px 48px; align-items: start; }
.reading p + p { margin-top: 12px; }
.reading .big { font: 500 22px/1.3 var(--body); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 18px 0 0; padding: 0; list-style: none;
  font: 500 14.5px/1.2 var(--display); font-stretch: 88%; color: var(--ink-2); }
.legend li { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { display: block; }

.axis { padding: 18px 0 14px; border-bottom: 1px solid var(--rule); }
.axis:first-of-type { padding-top: 0; }
.axis-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.axis-head h3 { margin: 0; font: 700 21px/1.2 var(--display); font-stretch: 78%; }
.axis-head p { color: var(--ink-2); font-size: 17px; line-height: 1.35; }
.scale { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) minmax(110px, 200px); gap: 14px; align-items: center; margin-top: 10px; }
.pole { font: 500 15px/1.15 var(--display); font-stretch: 86%; color: var(--muted); }
.pole.a { text-align: right; }
.pole.on { color: var(--ink); font-weight: 700; }
.track { position: relative; height: 30px; }
.track .zone { position: absolute; left: 37.5%; width: 25%; top: 7px; height: 16px; background: var(--island); border-radius: 2px; }
.track .line { position: absolute; left: 0; right: 0; top: 14.5px; height: 1px; background: var(--ink-2); }
.track .end { position: absolute; top: 9px; width: 1px; height: 12px; background: var(--ink-2); }
.track .mid { position: absolute; left: 50%; top: 3px; width: 1.5px; height: 24px; margin-left: -.75px; background: var(--ink); }
.track .fill { position: absolute; top: 10px; height: 10px; background: var(--accent); }
.track .fill.neg { border-radius: 5px 0 0 5px; }
.track .fill.pos { border-radius: 0 5px 5px 0; }
.track .fr { position: absolute; top: 3px; width: 24px; height: 24px; margin-left: -12px; padding: 0; border: 0; background: none; cursor: help; }
.track .fr::before { content: ""; position: absolute; left: 6.5px; top: 6.5px; width: 11px; height: 11px; transform: rotate(45deg);
  background: var(--friend); box-shadow: 0 0 0 2px var(--surface); }
.read { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 8px; }
.read b { font: 700 17px/1.3 var(--display); font-stretch: 86%; }
.read .num { font: 500 15px/1.3 var(--display); font-stretch: 88%; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 2px 9px; border: 1px solid var(--ink-2); border-radius: 999px;
  font: 600 13px/1.4 var(--display); font-stretch: 88%; color: var(--ink-2); cursor: help; }
.axis details { margin-top: 4px; }
.defs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 28px; margin: 6px 0 16px; }
.defs h4, .answers h4 { margin: 0 0 3px; font: 700 15px/1.25 var(--display); font-stretch: 86%; }
.defs p { font-size: 16px; line-height: 1.4; color: var(--ink-2); }
.answers { margin: 0; padding: 0; list-style: none; max-width: 70ch; }
.answers li { padding: 9px 0; border-top: 1px solid var(--rule); }
.answers .st { font-size: 17px; line-height: 1.4; }
.answers .an { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; margin-top: 2px;
  font: 500 14.5px/1.4 var(--display); font-stretch: 88%; color: var(--ink-2); }
.answers .an b { color: var(--ink); font-weight: 700; }

.share { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 48px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font: 600 15px/1.3 var(--display); font-stretch: 88%; }
.field .row { gap: 8px; }
input[type="text"] { width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--ink-2); border-radius: 3px;
  background: var(--surface); color: var(--ink); font: 500 16px/1.2 var(--display); font-stretch: 92%; letter-spacing: .02em; }
.row input[type="text"] { flex: 1 1 200px; width: auto; }
.hint { font: 500 14px/1.4 var(--display); font-stretch: 88%; color: var(--muted); }
.err { font: 600 15px/1.4 var(--display); font-stretch: 88%; color: var(--accent); min-height: 1.4em; }
.friends { margin: 0; padding: 0; list-style: none; }
.friends li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; padding: 12px 0; border-top: 1px solid var(--rule); }
.friends .who { font: 700 18px/1.2 var(--display); font-stretch: 84%; display: inline-flex; align-items: center; gap: 8px; }
.friends .who::before { content: ""; width: 9px; height: 9px; transform: rotate(45deg); background: var(--friend); }
.friends .how { flex: 1 1 240px; font-size: 16px; line-height: 1.35; color: var(--ink-2); }
.tbl { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; font: 500 14.5px/1.3 var(--display); font-stretch: 88%; font-variant-numeric: tabular-nums; min-width: 100%; }
th, td { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--rule); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 150px; }
thead th { font-weight: 700; border-bottom: 1.5px solid var(--ink); vertical-align: bottom; }
.method p, .method li { max-width: 68ch; font-size: 17px; line-height: 1.5; color: var(--ink-2); }
.method p + p { margin-top: 10px; }
.method summary { font-size: 17px; color: var(--ink); }
.ranked { margin: 8px 0 0; padding: 0; list-style: none; max-width: 560px; }
.ranked li { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-top: 1px solid var(--rule);
  font: 500 16px/1.3 var(--display); font-stretch: 88%; font-variant-numeric: tabular-nums; }

footer { margin-top: 72px; padding: 20px 0 48px; border-top: 1.5px solid var(--ink); }
footer p { max-width: 72ch; font: 500 14.5px/1.5 var(--display); font-stretch: 88%; color: var(--muted); }
footer p + p { margin-top: 8px; }

/* ---------- chart ---------- */
.c-sea { fill: var(--sea); }
.c-island { fill: var(--island); }
.c-grid { stroke: var(--rule); stroke-width: 1; }
.c-axis { stroke: var(--ink-2); stroke-width: 1; }
.c-frame { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.c-tick { font: 500 11px var(--display); fill: var(--muted); font-variant-numeric: tabular-nums; }
.c-end { font: 700 13px var(--display); font-stretch: 84%; fill: var(--ink); }
.c-seaname { font: italic 500 15px var(--body); letter-spacing: .14em; fill: var(--ink-2); opacity: .62; }
.c-camp rect { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.5; }
.c-camp.is-top rect { stroke: var(--ink); stroke-width: 2.5; }
.c-label { font: 600 11.5px var(--display); font-stretch: 84%; fill: var(--ink-2); }
.c-label.strong { fill: var(--ink); font-weight: 700; font-size: 13px; }
.c-ring { fill: var(--surface); }
.c-you-o { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.c-you-i { fill: var(--accent); }
.c-friend { fill: var(--friend); }
.c-bearing { stroke: var(--accent); stroke-width: 1.5; opacity: .6; }
.c-hit { fill: transparent; cursor: help; }
.c-pt:focus-visible { outline: none; }
.c-pt:focus-visible .c-hit { stroke: var(--accent); stroke-width: 2; }

#tip { position: fixed; z-index: 10; max-width: 270px; padding: 9px 11px; border-radius: 4px; background: var(--ink); color: var(--paper);
  font: 500 14px/1.35 var(--display); font-stretch: 88%; pointer-events: none; box-shadow: 0 4px 14px rgba(0, 0, 0, .22); }
#tip b { display: block; font-weight: 700; font-size: 15px; }
#tip span { display: block; opacity: .86; }
#tip[hidden] { display: none; }

@media (max-width: 880px) {
  .hero, .position, .share { grid-template-columns: minmax(0, 1fr); }
  .hero { padding: 32px 0 40px; }
  .axes-list { grid-template-columns: minmax(0, 1fr); }
  .defs { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  body { font-size: 17px; }
  .top-right .saved, .likert kbd, .keys { display: none; }
  .likert { grid-template-columns: minmax(0, 1fr); }
  .likert button { flex-direction: row; justify-content: flex-start; min-height: 52px; padding: 10px 16px; font-size: 17px; text-align: left; }
  .statement { margin: 26px 0 22px; min-height: 0; }
  .scale { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; }
  .scale .track { grid-column: 1 / -1; grid-row: 2; }
  .pole.a { text-align: left; }
  .pole.b { text-align: right; }
  .facts { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .facts dd { margin-bottom: 10px; }
  section { margin-top: 44px; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .likert button { transition: background-color .12s ease, color .12s ease, border-color .12s ease; }
}
</style>
</head>

<script id="core">
// ---------------------------------------------------------------------------
// Pure logic and content. No DOM in this block, so it can be loaded and tested
// with Node (see compass.test.js).
// ---------------------------------------------------------------------------

const KEYS = ['D1', 'D2', 'D3', 'D4', 'D5', 'D6', 'D7', 'D8'];

// low = the -100 pole, high = the +100 pole, mid = the synthesis zone around 0.
const AXES = {
  D1: { short: 'Risk', name: 'Ontological risk',
    q: 'What are we building, and can something smarter than us be controlled?',
    low: ['Techno-Optimist', 'AI is a controllable tool for human abundance.'],
    mid: ['Conditional Pragmatist', 'High capability brings serious tail risks; how manageable they are depends on engineering rigor.'],
    high: ['AI Doomer', 'Superintelligence would be an autonomous entity we may not be able to control, and a threat to our existence.'] },
  D2: { short: 'Pace', name: 'Development velocity',
    q: 'How fast should the most capable AI be built and released, relative to the rules around it?',
    low: ['Effective Accelerationist', 'Maximum speed, with as little regulatory friction as possible.'],
    mid: ['Staged Deployment Advocate', 'Scale up step by step, with each step tied to testing and red-teaming results.'],
    high: ['Safety-First Advocate', 'Legal guardrails and evidence of safety before scaling further.'] },
  D3: { short: 'Access', name: 'Control topology',
    q: 'Who gets access to the most capable models and the recipes for training them?',
    low: ['Open-Sourcer', 'Public weights, auditable code and power spread across many hands.'],
    mid: ['Tiered-Access Pragmatist', 'Open weights for models behind the frontier; audited access for the most dangerous ones.'],
    high: ['Frontier Gatekeeper', 'Closed models, reached through licensed and accountable institutions.'] },
  D4: { short: 'War', name: 'Geopolitical posture',
    q: 'How should AI change military power, deterrence and the use of force?',
    low: ['AI Dove', 'Binding international treaties that ban lethal autonomous weapons.'],
    mid: ['Deterrence Realist', 'Defensive military AI is acceptable; humans stay in the loop on strategic weapons, by treaty.'],
    high: ['AI Hawk', 'Military AI superiority over adversaries, because they will not hold back.'] },
  D5: { short: 'Labor', name: 'Economic integration',
    q: 'Does AI mostly make human workers more capable, or replace thinking work altogether?',
    low: ['Augmentation Optimist', 'A cognitive exoskeleton that raises what people can do.'],
    mid: ['Task-Reallocation Realist', 'Routine thinking tasks get automated; human value moves to judgment, taste and physical work.'],
    high: ['Labor-Disruption Realist', 'A drop-in replacement that displaces white-collar work at scale.'] },

// Scores each axis from -100 (low pole) to +100 (high pole).
// Skipped or unanswered statements are left out, not counted as neutral.
// conflict: 0..1, how strongly both poles were agreed with. reject: 0..1, how strongly both were rejected.
function scoreAxes(resp) {
  const acc = {}, out = {};
  KEYS.forEach(k => { acc[k] = { lo: 0, nlo: 0, hi: 0, nhi: 0 }; });
  ITEMS.forEach((it, i) => {
    const v = resp ? resp['q' + i] : undefined;
    if (typeof v !== 'number' || !isFinite(v)) return;
    const c = Math.max(-2, Math.min(2, v)), a = acc[it[0]];
    if (it[1] === 1) { a.hi += c; a.nhi++; } else { a.lo += c; a.nlo++; }
  });
  KEYS.forEach(k => {
    const a = acc[k], n = a.nlo + a.nhi;
    if (!n) { out[k] = { score: null, n: 0, conflict: 0, reject: 0 }; return; }
    const lo = a.nlo ? a.lo / a.nlo : null, hi = a.nhi ? a.hi / a.nhi : null;
    const both = lo !== null && hi !== null;
    const score = both ? (hi - lo) * 25 : (hi !== null ? hi * 50 : -lo * 50);
    out[k] = {
      score: score + 0, n: n,
      conflict: both ? Math.max(0, Math.min(lo, hi)) / 2 : 0,
      reject: both ? Math.max(0, Math.min(-lo, -hi)) / 2 : 0

  });
  return out;
}

const COMPASS_X = ['D3', 'D6', 'D8'], COMPASS_Y = ['D1', 'D2'];
function compass(get) {

    const v = ks.map(get).filter(x => typeof x === 'number');
    return v.length ? v.reduce((a, b) => a + b, 0) / v.length + 0 : null;

}

// How strongly held the profile is, and how much of it cancels out.
function profile(s) {
  const got = KEYS.filter(k => s[k] && s[k].score !== null);
  const avg = f => got.length ? got.reduce((t, k) => t + f(s[k]), 0) / got.length : 0;
  return { axes: got.length, strength: Math.sqrt(avg(a => a.score * a.score)), conflict: avg(a => a.conflict), reject: avg(a => a.reject) };
}

// Every camp with its similarity to the profile (cosine, -1..1), best first. Empty if the profile is too thin or flat.
function similarities(s) {
  const p = profile(s);

    let dot = 0, na = 0, nb = 0;
    idx.forEach(i => { const v = s[KEYS[i]].score; dot += v * f.d[i]; na += v * v; nb += f.d[i] * f.d[i]; });
    return Object.assign({}, f, { sim: na && nb ? dot / Math.sqrt(na * nb) : 0 });
  }).sort((a, b) => b.sim - a.sim);
}

// Camps close enough to name, best first.
function rank(s) { return similarities(s).filter(r => r.sim >= MIN_SIM); }

// 0..1: how close two sets of axis scores are. 1 = identical, 0 = 100 points apart on average.
function agreement(a, b) {
  const ks = KEYS.filter(k => a[k].score !== null && b[k].score !== null);
  if (!ks.length) return null;
  const gap = ks.reduce((t, k) => t + Math.abs(a[k].score - b[k].score), 0) / ks.length;
  return Math.max(0, 1 - gap / 100);
}

// ---------- state ----------
function sanitize(o) {

  if (Number.isInteger(o.idx)) out.idx = Math.max(0, Math.min(ORDER.length - 1, o.idx));
  if (o.resp && typeof o.resp === 'object') {

      const v = o.resp['q' + i];

  }
  if (typeof o.name === 'string') out.name = cleanName(o.name);
  if (Array.isArray(o.friends)) {
    out.friends = o.friends.filter(f => f && typeof f.code === 'string' && decodeCode(f.code))

}

function showTip(target, title, lines) {

// ---------- reading helpers ----------

}

}
function axisRead(k, a) {
  const A = AXES[k];

  const s = Math.round(a.score), abs = Math.abs(s), pole = s < 0 ? A.low[0] : A.high[0];
  if (abs <= ZONE) return { title: A.mid[0], num: abs ? 'middle ground, ' + abs + ' toward ' + pole : 'middle ground, dead center', side: 0 };
  return { title: (abs > 60 ? 'Firmly ' : 'Leans ') + pole, num: abs + ' of 100', side: s < 0 ? -1 : 1 };
}

  return { kind: 'uncharted' };
}

// ---------- the chart ----------
function drawCompass(box, data) {
  const W = Math.max(260, Math.min(620, Math.floor(box.getBoundingClientRect().width)));
  const small = W < 440;
  const m = { l: 32, r: 8, t: 8, b: 26 };
  const P = W - m.l - m.r, H = P + m.t + m.b;
  const X = v => m.l + (v + 100) / 200 * P, Y = v => m.t + (100 - v) / 200 * P;
  const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': data.label });
  const placed = [];
  const tw = (s, px) => s.length * px * 0.52 + 4;

  svg.append(sv('rect', { class: 'c-sea', x: m.l, y: m.t, width: P, height: P }),
    sv('rect', { class: 'c-island', x: X(-ZONE), y: Y(ZONE), width: P * ZONE / 100, height: P * ZONE / 100, rx: 3 }));
  [-50, 50].forEach(v => svg.append(
    sv('line', { class: 'c-grid', x1: X(v), x2: X(v), y1: m.t, y2: m.t + P }),
    sv('line', { class: 'c-grid', y1: Y(v), y2: Y(v), x1: m.l, x2: m.l + P })));
  svg.append(sv('line', { class: 'c-axis', x1: X(0), x2: X(0), y1: m.t, y2: m.t + P }),
    sv('line', { class: 'c-axis', y1: Y(0), y2: Y(0), x1: m.l, x2: m.l + P }),
    sv('rect', { class: 'c-frame', x: m.l, y: m.t, width: P, height: P }));
  [-100, -50, 0, 50, 100].forEach(v => svg.append(
    sv('text', { class: 'c-tick', x: X(v), y: m.t + P + 17, 'text-anchor': v === -100 ? 'start' : v === 100 ? 'end' : 'middle' }, num(v)),
    sv('text', { class: 'c-tick', x: m.l - 6, y: Y(v) + (v === 100 ? 9 : v === -100 ? -1 : 4), 'text-anchor': 'end' }, num(v))));

  // the four seas, named like water on a chart
  const seaPx = small ? 12.5 : 15;
  [['Public', 'Guardrails', -64, 58], ['Guarded', 'Frontier', 71, 76], ['Open', 'Acceleration', -64, -31], ['Industrial', 'Acceleration', 67, -24]].forEach(q => {
    const t = sv('text', { class: 'c-seaname', 'text-anchor': 'middle', style: 'font-size:' + seaPx + 'px', 'aria-hidden': 'true' },
      sv('tspan', { x: X(q[2]), y: Y(q[3]) }, q[0]), sv('tspan', { x: X(q[2]), dy: seaPx * 1.15 }, q[1]));
    svg.append(t);
    const w = Math.max(q[0].length, q[1].length) * seaPx * 0.62;
    placed.push({ x0: X(q[2]) - w / 2, x1: X(q[2]) + w / 2, y0: Y(q[3]) - seaPx, y1: Y(q[3]) + seaPx * 1.5 });
  });
  // axis ends
  [['Caution', X(0) + 7, m.t + 17, 'start'], ['Speed', X(0) + 7, m.t + P - 9, 'start'],
    ['Distributed', m.l + 7, Y(0) + 16, 'start'], ['Concentrated', m.l + P - 7, Y(0) + 16, 'end']].forEach(e => {
    svg.append(sv('text', { class: 'c-end', x: e[1], y: e[2], 'text-anchor': e[3] }, e[0]));
    const w = tw(e[0], 13);
    placed.push({ x0: e[3] === 'end' ? e[1] - w : e[1], x1: e[3] === 'end' ? e[1] : e[1] + w, y0: e[2] - 12, y1: e[2] + 3 });
  });

  const pts = [];
  data.camps.forEach((c, i) => pts.push({ kind: 'camp', x: c.x, y: c.y, r: 5, label: c.tag, prefs: c.lp, top: c.top,
    wantLabel: i < (small ? (data.you ? 3 : 5) : 99), title: c.name, lines: [c.creed, whereText(c)] }));
  (data.friends || []).forEach(f => pts.push({ kind: 'friend', x: f.x, y: f.y, r: 8, label: f.name, prefs: 'rltb', wantLabel: true,
    title: f.name, lines: [whereText(f), f.camp ? 'Closest camp: ' + f.camp : ''] }));
  if (data.you) pts.push({ kind: 'you', x: data.you.x, y: data.you.y, r: 10, label: data.you.name, prefs: 'rltb', wantLabel: true,
    title: data.you.name, lines: [whereText(data.you), data.you.camp ? 'Closest camp: ' + data.you.camp : ''] });
  pts.forEach(p => { p.px = X(p.x); p.py = Y(p.y); placed.push({ x0: p.px - p.r - 2, x1: p.px + p.r + 2, y0: p.py - p.r - 2, y1: p.py + p.r + 2 }); });

  const hits = b => placed.some(q => b.x0 < q.x1 && b.x1 > q.x0 && b.y0 < q.y1 && b.y1 > q.y0);

    const inY = y => Math.max(m.t + 4, Math.min(m.t + P - 4 - hgt, y)), inX = x => Math.max(m.l + 4, Math.min(m.l + P - 4 - w, x));

  }
  ['camp', 'friend', 'you'].forEach(kind => pts.filter(p => p.kind === kind).forEach(p => {
    const g = sv('g', { class: 'c-pt c-' + p.kind + (p.top ? ' is-top' : ''), tabindex: 0, role: 'img',
      'aria-label': p.title + ': ' + p.lines.filter(Boolean).join('. ') });
    if (p.kind === 'camp') g.append(sv('rect', { x: p.px - 4.5, y: p.py - 4.5, width: 9, height: 9 }));
    if (p.kind === 'friend') g.append(
      sv('rect', { class: 'c-ring', x: p.px - 7.5, y: p.py - 7.5, width: 15, height: 15, transform: 'rotate(45 ' + p.px + ' ' + p.py + ')' }),
      sv('rect', { class: 'c-friend', x: p.px - 5.5, y: p.py - 5.5, width: 11, height: 11, transform: 'rotate(45 ' + p.px + ' ' + p.py + ')' }));
    if (p.kind === 'you') g.append(sv('circle', { class: 'c-ring', cx: p.px, cy: p.py, r: 11.5 }),
      sv('circle', { class: 'c-you-o', cx: p.px, cy: p.py, r: 8 }), sv('circle', { class: 'c-you-i', cx: p.px, cy: p.py, r: 3.4 }));
    if (p.lab) g.append(sv('text', { class: 'c-label' + (p.kind !== 'camp' || p.top ? ' strong' : ''), x: p.lab.x, y: p.lab.y, 'text-anchor': p.lab.anchor }, p.label));
    g.append(sv('circle', { class: 'c-hit', cx: p.px, cy: p.py, r: 13 }));

}

  else if (e.key === '0') { answer(null); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') step(-1);
  else if (e.key === 'ArrowRight') step(1);
});

function axisBlock(k, a, self, resp, fr) {
  const A = AXES[k], rd = axisRead(k, a), s = a.score;
  const track = h('div', { class: 'track', role: 'img', 'aria-label': A.short + ': ' + rd.title + (rd.num ? ', ' + rd.num : '') },
    h('span', { class: 'zone' }), h('span', { class: 'line' }),
    h('span', { class: 'end', style: 'left:0' }), h('span', { class: 'end', style: 'right:0' }), h('span', { class: 'mid' }),
    s !== null && Math.round(s) !== 0 && h('span', { class: 'fill ' + (s < 0 ? 'neg' : 'pos'), style: s < 0 ? 'left:' + (50 + s / 2) + '%;width:' + (-s / 2) + '%' : 'left:50%;width:' + (s / 2) + '%' }),
    fr.filter(f => f.sc[k].score !== null).map(f => {
      const r = axisRead(k, f.sc[k]);
      return tip(h('button', { class: 'fr', type: 'button', style: 'left:' + (50 + f.sc[k].score / 2) + '%', 'aria-label': f.name + ': ' + r.title }), f.name, [r.title, r.num]);
    }));
  const chips = [];
  if (a.conflict >= 0.5) chips.push(tip(h('span', { class: 'chip', tabindex: 0, text: 'Pulled both ways' }), 'Pulled both ways',
    ['Statements from both poles got agreement, so they cancel out. This is different from having no view.']));
  if (a.reject >= 0.5) chips.push(tip(h('span', { class: 'chip', tabindex: 0, text: 'Neither pole fits' }), 'Neither pole fits',
    ['Statements from both poles got disagreement, so they cancel out.']));
  const mine = ORDER.filter(i => ITEMS[i][0] === k);
  return h('div', { class: 'axis', id: 'axis-' + k },
    h('div', { class: 'axis-head' }, h('h3', { text: A.short }), h('p', { text: A.q })),
    h('div', { class: 'scale' },
      h('span', { class: 'pole a' + (rd.side < 0 ? ' on' : ''), text: A.low[0] }), track,
      h('span', { class: 'pole b' + (rd.side > 0 ? ' on' : ''), text: A.high[0] })),
    h('div', { class: 'read' }, h('b', { text: rd.title }), rd.num && h('span', { class: 'num', text: rd.num }), chips),
    h('details', null,
      h('summary', { text: 'The positions, and the answers behind this score' }),
      h('div', { class: 'defs' }, [A.low, A.mid, A.high].map(d => h('div', null, h('h4', { text: d[0] }), h('p', { text: d[1] })))),
      h('ul', { class: 'answers' }, mine.map(i => {
        const v = resp['q' + i], it = ITEMS[i], given = typeof v === 'number';
        const toward = it[1] === 1 ? A.high[0] : A.low[0];
        return h('li', null,
          h('p', { class: 'st', text: it[2] }),
          h('div', { class: 'an' },
            h('span', null, h('b', { text: given ? ANSWER[v] : ('q' + i) in resp ? 'Skipped' : 'Not answered yet' }), '. Agreeing points toward ' + toward + '.'),
            self && btn(given ? 'Change' : 'Answer', 'quiet', () => { st.idx = ORDER.indexOf(i); go('quiz'); editOne = k; })));
      }))));
}

function resultView() {
  const all = friends();
  const viewing = st.viewing != null ? all[st.viewing] : null;
  const self = !viewing;
  const resp = self ? st.resp : viewing.resp, sc = scoreAxes(resp);
  const fr = self ? all : [];
  const v = verdict(sc), sims = similarities(sc), pos = compass(k => sc[k].score);
  const n = answered(resp), left = ITEMS.length - touched();
  const whose = self ? 'Your' : possessive(viewing.name);
  const youName = self ? 'You' : viewing.name;

  const head = [];
  if (v.kind === 'camp') {
    const fit = v.top.sim >= 0.75 ? 'a close fit' : v.top.sim >= 0.6 ? 'a fair fit' : 'a loose fit';
    head.push(
      h('p', { class: 'kicker', text: whose + ' closest camp' }),
      h('h1', { class: 'camp-name', tabindex: -1, 'data-focus': true, text: v.top.name }),
      h('p', { class: 'match' }, pct(v.top.sim) + ' match', h('span', { text: ', ' + fit })),
      h('p', { class: 'creed', text: v.top.creed }),
      h('p', { class: 'about', text: v.top.about }),
      h('dl', { class: 'facts' },
        h('dt', { text: 'Critics say' }), h('dd', { text: v.top.critics }),
        h('dt', { text: 'Who is here' }), h('dd', { text: v.top.near }),
        v.rest.length > 0 && [h('dt', { text: 'Next closest' }), h('dd', { text: v.rest.map(r => r.name + ' (' + pct(r.sim) + ')').join(', ') })]));
  } else {
    const copy = {
      thin: ['Not enough answers yet', 'A reading needs answers on at least five of the eight axes.'],
      middle: ['The middle ground', 'On most axes the answers sit near the center. On this chart that is the island: conditional, case-by-case positions instead of one camp’s whole package.'],
      torn: ['Pulled both ways', 'Statements from opposite sides both got agreement on most axes, so they cancel out. People who see force in both arguments land here, and no single camp matches that.'],
      uncharted: ['Uncharted waters', 'These are clear views in a combination none of the eleven camps shares. The bars below show where they fall on each axis.']
    }[v.kind];
    head.push(
      h('p', { class: 'kicker', text: whose + ' result' }),
      h('h1', { class: 'camp-name', tabindex: -1, 'data-focus': true, text: copy[0] }),
      h('p', { class: 'about', style: 'margin-top:20px', text: copy[1] }));
  }
  if (self && left > 0) head.push(h('div', { class: 'partial' },
    h('span', { text: 'A rough reading from ' + n + ' of ' + ITEMS.length + ' statements. The rest will sharpen it.' }),
    btn('Answer the remaining ' + left, 'small', () => { st.idx = firstOpen(); go('quiz'); })));
  if (!self) head.push(h('div', { class: 'partial' },
    h('span', { text: 'You are looking at the result ' + viewing.name + ' shared.' }),
    canRead() ? btn('Back to your result', 'small', () => { st.viewing = null; go('result'); })
      : btn(touched() ? 'Continue your own quiz' : 'Take the quiz yourself', 'small', () => { st.viewing = null; st.idx = firstOpen(); go('quiz'); })));

  const ordered = sims.length ? sims : FACTIONS;
  const camps = campPoints(sims.length ? sims : null);
  const topCamp = v.kind === 'camp' ? camps[0] : null;
  const havePos = pos.x !== null && pos.y !== null;
  const quad = havePos ? quadrant(pos) : null;
  const friendPts = fr.map(f => {
    const c = compass(k => f.sc[k].score), t = rank(f.sc)[0];
    return Object.assign(c, { name: f.name, camp: t && t.name });
  }).filter(f => f.x !== null && f.y !== null);

  const position = h('section', null,
    h('h2', { text: self ? 'Where you sit' : 'Where ' + viewing.name + ' sits' }),
    h('div', { class: 'position' },
      h('figure', { class: 'chart' },
        compassBox({
          label: 'Chart of ' + (self ? 'your' : possessive(viewing.name)) + ' position among eleven reference camps',
          camps: camps, friends: friendPts,
          you: havePos && { x: pos.x, y: pos.y, name: youName, camp: topCamp && topCamp.name },
          bearing: topCamp
        }),
        legend(havePos, youName, friendPts.length > 0)),
      h('div', { class: 'reading' },
        havePos ? [
          h('p', { class: 'big', text: quad ? (self ? 'You are' : viewing.name + ' is') + ' in ' + quad[0] + ' waters: ' + quad[1] + '.'
            : (self ? 'You are' : viewing.name + ' is') + ' on the island, the middle ground where neither direction dominates.' }),
          h('p', { text: 'Position: ' + whereText(pos) + ', on a scale of 100 each way.' }),
          topCamp && h('p', { text: 'The line points to ' + topCamp.name + ', the closest camp across all eight axes. It need not be the nearest mark on the chart, because the chart shows only five of them.' })
        ] : h('p', { text: 'Answer statements on risk, pace, access, compute or wealth to get a position.' }),
        h('p', { text: 'Left to right averages the access, compute and wealth axes. Bottom to top averages risk and pace. War, labor and architecture have their own bars below and do not move the mark.' }))));

  const axes = h('section', null,
    h('h2', { text: self ? 'Your eight axes' : possessive(viewing.name) + ' eight axes' }),
    KEYS.map(k => axisBlock(k, sc[k], self, resp, fr)));

  const ranked = sims.length > 0 && h('section', null,
    h('h2', { text: 'All eleven camps, closest first' }),
    h('p', { class: 'hint', text: '100 means the same direction on every axis, 0 means unrelated, and a negative number means the opposite direction.' }),
    h('ol', { class: 'ranked' }, ordered.map(r => tip(h('li', { tabindex: 0 }, h('span', { text: r.name }), h('span', { text: num(r.sim * 100) })), r.name, [r.creed]))));

  return h('main', null, h('div', { class: 'result-head' }, head), position, axes, self && shareSection(sc, fr), ranked, methodSection());
}

function shareSection(sc, fr) {
  const code = () => encodeCode(st.resp, st.name);
  const link = !framed && /^https?:$/.test(location.protocol) ? () => location.href.split('#')[0] + '#r-' + code() : null;
  const out = h('input', { type: 'text', id: 'your-code', readonly: true, value: code(), 'aria-describedby': 'code-hint', onfocus: e => e.target.select() });
  const err = h('p', { class: 'err', role: 'alert' });
  function copy(text, b, label) {
    const done = ok => { b.textContent = ok ? 'Copied' : 'Select the code and copy it'; setTimeout(() => { b.textContent = label; }, 2200); };
    const fallback = () => { out.focus(); out.select(); let ok = false; try { ok = text === out.value && document.execCommand('copy'); } catch (e) { ok = false; } done(ok); };
    try { navigator.clipboard.writeText(text).then(() => done(true), fallback); } catch (e) { fallback(); }
  }
  const copyBtn = btn('Copy code', 'small', () => copy(code(), copyBtn, 'Copy code'));
  const linkBtn = link && btn('Copy link', 'small', () => copy(link(), linkBtn, 'Copy link'));
  const name = h('input', { type: 'text', id: 'your-name', maxlength: 20, value: st.name, autocomplete: 'off',
    oninput: e => { st.name = cleanName(e.target.value); out.value = code(); save(); } });
  const theirs = h('input', { type: 'text', id: 'friend-code', autocomplete: 'off', spellcheck: 'false', placeholder: CODE_PREFIX + '-…' });
  const addIt = e => {
    if (e) e.preventDefault();
    if (!theirs.value.trim()) { err.textContent = 'Paste a friend’s code first.'; return; }
    const msg = addFriend(theirs.value);
    if (msg) { err.textContent = msg; return; }
    render(); const el = document.getElementById('compare'); if (el) el.scrollIntoView({ block: 'start' });
  };
  const rows = [];
  KEYS.forEach(k => rows.push([AXES[k].short + ': ' + AXES[k].low[0] + ' (−) to ' + AXES[k].high[0] + ' (+)', sc[k].score, fr.map(f => f.sc[k].score)]));
  const mine = compass(k => sc[k].score), theirPos = fr.map(f => compass(k => f.sc[k].score));
  rows.push(['Chart, left to right: distributed (−) to concentrated (+)', mine.x, theirPos.map(c => c.x)]);
  rows.push(['Chart, bottom to top: speed (−) to caution (+)', mine.y, theirPos.map(c => c.y)]);
  const cell = v => h('td', { text: v === null ? '–' : num(v) });

  return h('section', { id: 'compare' },
    h('h2', { text: 'Compare with friends' }),
    h('div', { class: 'share' },
      h('div', null,
        h('div', { class: 'field' }, h('label', { for: 'your-name', text: 'Your name, to show beside your mark (optional)' }), name),
        h('div', { class: 'field' }, h('label', { for: 'your-code', text: 'Your code' }),
          out, h('div', { class: 'row' }, copyBtn, linkBtn),
          h('p', { class: 'hint', id: 'code-hint', text: 'Send this to a friend. It holds your answers to all 48 statements, so share it with people you are happy to show them to.' }))),
      h('form', { onsubmit: addIt },
        h('div', { class: 'field' }, h('label', { for: 'friend-code', text: 'A friend’s code' }),
          h('div', { class: 'row' }, theirs, h('button', { class: 'btn small', type: 'submit', text: 'Add to the chart' })), err),
        fr.length === 0 && h('p', { class: 'hint', text: 'Paste a code and your friend appears on the chart and on every axis above, with how closely the two of you line up.' }))),
    fr.length > 0 && h('ul', { class: 'friends' }, fr.map(f => {
      const ag = agreement(sc, f.sc), both = KEYS.filter(k => sc[k].score !== null && f.sc[k].score !== null);
      const gap = k => Math.abs(sc[k].score - f.sc[k].score);
      const far = both.slice().sort((a, b) => gap(b) - gap(a))[0], near = both.slice().sort((a, b) => gap(a) - gap(b))[0];
      const t = rank(f.sc)[0];
      return h('li', null,
        h('span', { class: 'who', text: f.name }),
        h('span', { class: 'how', text: (ag === null ? 'No axes in common yet.' : pct(ag) + ' aligned with you. Closest on ' + AXES[near].short.toLowerCase() + ', furthest apart on ' + AXES[far].short.toLowerCase() + '.') + (t ? ' Closest camp: ' + t.name + '.' : '') }),
        h('span', { class: 'row' },
          btn('See full result', 'small', () => { st.viewing = f.i; go('result'); }),
          btn('Remove', 'quiet', () => { st.friends.splice(f.i, 1); render(); })));
    })),
    h('details', null, h('summary', { text: 'Scores as a table' }),
      h('div', { class: 'tbl' }, h('table', null,
        h('thead', null, h('tr', null, h('th', { scope: 'col', text: 'Axis' }), h('th', { scope: 'col', text: 'You' }), fr.map(f => h('th', { scope: 'col', text: f.name })))),
        h('tbody', null, rows.map(r => h('tr', null, h('td', { text: r[0] }), cell(r[1]), r[2].map(cell))))))));
}

function methodSection() {
  return h('section', { class: 'method' },
    h('h2', { text: 'How the scoring works' }),
    h('p', { text: 'Each axis has six statements, three written from each of its two poles. Your score is how much more you agree with one side than the other, from 100 one way to 100 the other. Statements you skip are left out; they are not counted as neutral.' }),
    h('p', { text: 'Agreeing with both sides gives a score near zero and a “pulled both ways” flag, so a moderate and someone who holds both views strongly are told apart. Scores within 25 of the center count as the middle ground, which each axis names.' }),
    h('p', { text: 'Each camp is a profile on all eight axes. Your closest camp is the one whose profile points in the direction most like yours, whether your views are mild or strong. If nothing reaches 45 percent, no camp is named.' }),
    h('details', null, h('summary', { text: 'The eleven camp profiles' }),
      h('div', { class: 'tbl' }, h('table', null,
        h('thead', null, h('tr', null, h('th', { scope: 'col', text: 'Camp' }), KEYS.map(k => h('th', { scope: 'col', text: AXES[k].short })))),
        h('tbody', null, FACTIONS.map(f => h('tr', null, h('td', { text: f.name }), f.d.map(v => h('td', { text: num(v) })))))))),
    h('p', { style: 'margin-top:14px', text: 'The camps are simplified reference points, and the public figures named beside some of them are rough signposts based on positions they have argued in public. The quiz does not measure what any of them actually thinks, and every camp has serious people in it.' }));
}

function footer() {
  return h('footer', null,
    h('p', null, 'Eight axes, 48 statements, eleven reference camps. The starting point was Kristin Houser’s ',
      h('a', { href: 'https://bigthinkmedia.substack.com/p/10-perspectives-that-divide-the-ai', target: '_blank', rel: 'noopener noreferrer', text: '“10 perspectives that divide the AI world”' }),
      ' in Big Think, reworked from ten tribes into eight independent axes.'),
    h('p', { text: 'Nothing you enter is sent anywhere. Answers are kept in this browser, and a code only travels when you send it yourself.' }));
}

function render(focus) {
  afterRender = []; mounted = [];
  if (st.view === 'result' && st.viewing == null && !canRead()) st.view = 'intro';
  if (st.viewing != null && !st.friends[st.viewing]) st.viewing = null;
  const view = st.view === 'quiz' ? quizView() : st.view === 'result' ? resultView() : introView();
  $app.replaceChildren(topBar(), view, footer());
  afterRender.forEach(f => f());
  save();
  if (focus) { const el = $app.querySelector('[data-focus]'); if (el) el.focus({ preventScroll: true }); }
}

// A link can carry a friend's result as #r-CODE.
function readHash() {
  const m = /^#r-(.+)$/i.exec(location.hash || '');
  if (!m) return;
  const d = decodeCode(m[1]);
  if (!d) return;
  if (answered() && bodyOf(encodeCode(d.resp, '')) === bodyOf(encodeCode(st.resp, ''))) return;
  if (addFriend(m[1])) return;
  const who = d.name || 'A friend';
  if (canRead()) { st.view = 'result'; st.viewing = null; }
  else { st.view = 'intro'; st.note = who + ' sent you their result. Take the quiz and you will both be on the chart.'; }
}
window.addEventListener('hashchange', () => { readHash(); render(); });

function start(data) {
  load();
  Object.assign(st, sanitize(data));
  readHash();
  render();
}
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) hot.snapshot(snapshot);
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
